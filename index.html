<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signal — AI & Tech Feed</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --surface: #111111;
    --surface2: #1a1a1a;
    --border: #222222;
    --text: #e8e8e8;
    --text-muted: #666666;
    --text-dim: #444444;
    --bloomberg: #f5a623;
    --reuters: #e05252;
    --accent: #4af0c4;
    --tag-bg: #1e1e1e;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    font-weight: 300;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Subtle noise texture overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 0;
    opacity: 0.4;
  }

  /* ── HEADER ── */
  header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(10,10,10,0.92);
    backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
    padding: 0 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 60px;
  }

  .logo {
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    font-weight: 900;
    letter-spacing: -0.5px;
    color: var(--text);
  }

  .logo span {
    color: var(--accent);
  }

  .header-meta {
    display: flex;
    align-items: center;
    gap: 24px;
  }

  .live-badge {
    display: flex;
    align-items: center;
    gap: 7px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .live-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent);
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.85); }
  }

  .refresh-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-muted);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 6px 14px;
    cursor: pointer;
    transition: all 0.2s;
    border-radius: 2px;
  }

  .refresh-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .refresh-btn.spinning svg {
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── CONTROLS ── */
  .controls {
    padding: 20px 32px 0;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .filter-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-muted);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 6px 14px;
    cursor: pointer;
    transition: all 0.2s;
    border-radius: 2px;
  }

  .filter-btn.active {
    background: var(--surface2);
    color: var(--text);
    border-color: #444;
  }

  .filter-btn[data-source="bloomberg"].active {
    border-color: var(--bloomberg);
    color: var(--bloomberg);
  }

  .filter-btn[data-source="reuters"].active {
    border-color: var(--reuters);
    color: var(--reuters);
  }

  .search-wrap {
    margin-left: auto;
    position: relative;
  }

  .search-wrap svg {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-dim);
  }

  #search {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 13px;
    padding: 7px 14px 7px 32px;
    width: 220px;
    outline: none;
    border-radius: 2px;
    transition: border-color 0.2s;
  }

  #search:focus { border-color: #444; }
  #search::placeholder { color: var(--text-dim); }

  /* ── STATS BAR ── */
  .stats-bar {
    padding: 16px 32px;
    display: flex;
    gap: 32px;
    border-bottom: 1px solid var(--border);
    margin-top: 16px;
  }

  .stat {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .stat-value {
    font-family: 'Playfair Display', serif;
    font-size: 28px;
    font-weight: 700;
    line-height: 1;
    color: var(--text);
  }

  .stat-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  .stat-divider {
    width: 1px;
    background: var(--border);
    align-self: stretch;
  }

  /* ── MAIN GRID ── */
  main {
    padding: 24px 32px 48px;
    position: relative;
    z-index: 1;
  }

  .feed-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
  }

  .feed-col {
    display: flex;
    flex-direction: column;
    gap: 0;
  }

  .col-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding-bottom: 14px;
    border-bottom: 2px solid;
    margin-bottom: 0;
  }

  .col-header.bloomberg { border-color: var(--bloomberg); }
  .col-header.reuters { border-color: var(--reuters); }

  .source-name {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  .source-name.bloomberg { color: var(--bloomberg); }
  .source-name.reuters { color: var(--reuters); }

  .col-count {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--text-muted);
    margin-left: auto;
  }

  /* ── ARTICLE CARDS ── */
  .article {
    padding: 18px 0;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: all 0.2s;
    animation: fadeIn 0.4s ease both;
    position: relative;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .article:hover {
    padding-left: 12px;
  }

  .article::before {
    content: '';
    position: absolute;
    left: 0;
    top: 18px;
    bottom: 18px;
    width: 2px;
    background: var(--bloomberg);
    transform: scaleY(0);
    transition: transform 0.2s;
    transform-origin: bottom;
  }

  .reuters-col .article::before { background: var(--reuters); }

  .article:hover::before {
    transform: scaleY(1);
  }

  .article-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
  }

  .article-num {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--text-dim);
    min-width: 20px;
  }

  .article-tag {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 2px 7px;
    border-radius: 1px;
    background: var(--tag-bg);
    color: var(--text-muted);
    border: 1px solid var(--border);
  }

  .article-date {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--text-dim);
    margin-left: auto;
  }

  .article-title {
    font-family: 'Playfair Display', serif;
    font-size: 15px;
    font-weight: 400;
    line-height: 1.5;
    color: var(--text);
    margin-bottom: 8px;
  }

  .article-desc {
    font-size: 12.5px;
    line-height: 1.6;
    color: var(--text-muted);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .article-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 10px;
  }

  .why-badge {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.06em;
    color: var(--text-dim);
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 5px;
    cursor: pointer;
    transition: color 0.2s;
  }

  .why-badge:hover { color: var(--accent); }

  .read-link {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--text-dim);
    text-decoration: none;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    transition: color 0.2s;
  }

  .read-link:hover { color: var(--text); }

  /* ── SIGNAL FILTER ROW ── */
  .signal-filters {
    padding: 10px 32px 16px;
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--border);
  }

  .signal-filter-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-right: 4px;
    white-space: nowrap;
  }

  .signal-filter-pill {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9.5px;
    font-weight: 500;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 4px 10px 4px 8px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: none;
    color: var(--text-dim);
    cursor: pointer;
    transition: all 0.18s;
    white-space: nowrap;
  }

  .signal-filter-pill .pill-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    flex-shrink: 0;
    opacity: 0.4;
    transition: opacity 0.18s;
  }

  .signal-filter-pill:hover {
    color: var(--text-muted);
    border-color: #333;
  }

  .signal-filter-pill.active {
    color: inherit;
    border-color: currentColor;
  }

  .signal-filter-pill.active .pill-dot { opacity: 1; }

  .signal-filter-pill.active.fpill-threat { color: #f87171; background: rgba(239,68,68,0.08); border-color: rgba(239,68,68,0.35); }
  .signal-filter-pill.active.fpill-market { color: #f5a623; background: rgba(245,166,35,0.08); border-color: rgba(245,166,35,0.35); }
  .signal-filter-pill.active.fpill-geopolitical { color: #a78bfa; background: rgba(139,92,246,0.08); border-color: rgba(139,92,246,0.35); }
  .signal-filter-pill.active.fpill-viral { color: #f472b6; background: rgba(236,72,153,0.08); border-color: rgba(236,72,153,0.35); }
  .signal-filter-pill.active.fpill-trend { color: #4af0c4; background: rgba(74,240,196,0.08); border-color: rgba(74,240,196,0.35); }
  .signal-filter-pill.active.fpill-breaking { color: #fb923c; background: rgba(251,146,60,0.08); border-color: rgba(251,146,60,0.35); }
  .signal-filter-pill.active.fpill-investor { color: #4ade80; background: rgba(34,197,94,0.08); border-color: rgba(34,197,94,0.35); }
  .signal-filter-pill.active.fpill-policy { color: #38bdf8; background: rgba(56,189,248,0.08); border-color: rgba(56,189,248,0.35); }

  .fpill-threat .pill-dot { background: #f87171; }
  .fpill-market .pill-dot { background: #f5a623; }
  .fpill-geopolitical .pill-dot { background: #a78bfa; }
  .fpill-viral .pill-dot { background: #f472b6; }
  .fpill-trend .pill-dot { background: #4af0c4; }
  .fpill-breaking .pill-dot { background: #fb923c; }
  .fpill-investor .pill-dot { background: #4ade80; }
  .fpill-policy .pill-dot { background: #38bdf8; }

  .clear-signals {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9.5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-dim);
    background: none;
    border: none;
    cursor: pointer;
    margin-left: 4px;
    padding: 4px 6px;
    transition: color 0.18s;
    display: none;
  }

  .clear-signals:hover { color: var(--text-muted); }
  .clear-signals.visible { display: inline-block; }

  /* ── SIGNAL PILLS ── */
  .signal-pills {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-bottom: 10px;
  }

  .signal-pill {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9.5px;
    font-weight: 500;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 3px 9px 3px 7px;
    border-radius: 20px;
    border: 1px solid;
    white-space: nowrap;
    transition: opacity 0.2s;
  }

  .signal-pill .pill-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  /* Pill color themes */
  .pill-threat {
    background: rgba(239, 68, 68, 0.08);
    color: #f87171;
    border-color: rgba(239, 68, 68, 0.25);
  }
  .pill-threat .pill-dot { background: #f87171; }

  .pill-market {
    background: rgba(245, 166, 35, 0.08);
    color: #f5a623;
    border-color: rgba(245, 166, 35, 0.25);
  }
  .pill-market .pill-dot { background: #f5a623; }

  .pill-geopolitical {
    background: rgba(139, 92, 246, 0.08);
    color: #a78bfa;
    border-color: rgba(139, 92, 246, 0.25);
  }
  .pill-geopolitical .pill-dot { background: #a78bfa; }

  .pill-viral {
    background: rgba(236, 72, 153, 0.08);
    color: #f472b6;
    border-color: rgba(236, 72, 153, 0.25);
  }
  .pill-viral .pill-dot { background: #f472b6; }

  .pill-trend {
    background: rgba(74, 240, 196, 0.08);
    color: #4af0c4;
    border-color: rgba(74, 240, 196, 0.25);
  }
  .pill-trend .pill-dot { background: #4af0c4; }

  .pill-breaking {
    background: rgba(251, 146, 60, 0.08);
    color: #fb923c;
    border-color: rgba(251, 146, 60, 0.25);
  }
  .pill-breaking .pill-dot { background: #fb923c; }

  .pill-investor {
    background: rgba(34, 197, 94, 0.08);
    color: #4ade80;
    border-color: rgba(34, 197, 94, 0.25);
  }
  .pill-investor .pill-dot { background: #4ade80; }

  .pill-policy {
    background: rgba(56, 189, 248, 0.08);
    color: #38bdf8;
    border-color: rgba(56, 189, 248, 0.25);
  }
  .pill-policy .pill-dot { background: #38bdf8; }

  /* ── WHY TOOLTIP ── */
  .why-panel {
    display: none;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-left: 2px solid var(--accent);
    padding: 10px 14px;
    margin-top: 10px;
    font-size: 12px;
    line-height: 1.6;
    color: var(--text-muted);
    border-radius: 0 2px 2px 0;
    animation: fadeIn 0.2s ease;
  }

  .why-panel.open { display: block; }

  /* ── EMPTY STATE ── */
  .empty {
    padding: 48px 0;
    text-align: center;
    color: var(--text-dim);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.06em;
  }

  /* ── FOOTER ── */
  footer {
    border-top: 1px solid var(--border);
    padding: 16px 32px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .footer-text {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .feed-urls {
    display: flex;
    gap: 20px;
  }

  .feed-url {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 0.04em;
    transition: color 0.2s;
    cursor: pointer;
  }

  .feed-url:hover { color: var(--text-muted); }

  /* ── COMBINED VIEW ── */
  .combined-feed {
    display: none;
    flex-direction: column;
  }

  .combined-feed .article {
    display: flex;
    gap: 16px;
    align-items: flex-start;
  }

  .source-pill {
    flex-shrink: 0;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 3px 8px;
    border-radius: 1px;
    margin-top: 2px;
  }

  .source-pill.bloomberg {
    background: rgba(245,166,35,0.1);
    color: var(--bloomberg);
    border: 1px solid rgba(245,166,35,0.2);
  }

  .source-pill.reuters {
    background: rgba(224,82,82,0.1);
    color: var(--reuters);
    border: 1px solid rgba(224,82,82,0.2);
  }

  .combined-article-body { flex: 1; }
</style>
</head>
<body>

<header>
  <div class="logo">Signal<span>.</span></div>
  <div class="header-meta">
    <div class="live-badge">
      <div class="live-dot"></div>
      <span id="lastUpdate">Updated just now</span>
    </div>
    <button class="refresh-btn" id="refreshBtn" onclick="refresh()">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:inline;vertical-align:middle;margin-right:5px"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
      Refresh
    </button>
  </div>
</header>

<div class="controls">
  <button class="filter-btn active" data-source="all" onclick="setFilter('all', this)">All</button>
  <button class="filter-btn" data-source="bloomberg" onclick="setFilter('bloomberg', this)">Bloomberg</button>
  <button class="filter-btn" data-source="reuters" onclick="setFilter('reuters', this)">Reuters</button>
  <div class="search-wrap">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input type="text" id="search" placeholder="Filter articles..." oninput="filterArticles()">
  </div>
</div>

<div class="signal-filters">
  <span class="signal-filter-label">Signals:</span>
  <button class="signal-filter-pill fpill-threat" data-signal="threat" onclick="toggleSignalFilter('threat', this)"><span class="pill-dot"></span>Threat</button>
  <button class="signal-filter-pill fpill-breaking" data-signal="breaking" onclick="toggleSignalFilter('breaking', this)"><span class="pill-dot"></span>Breaking</button>
  <button class="signal-filter-pill fpill-market" data-signal="market" onclick="toggleSignalFilter('market', this)"><span class="pill-dot"></span>Market Mover</button>
  <button class="signal-filter-pill fpill-investor" data-signal="investor" onclick="toggleSignalFilter('investor', this)"><span class="pill-dot"></span>Investor Alert</button>
  <button class="signal-filter-pill fpill-policy" data-signal="policy" onclick="toggleSignalFilter('policy', this)"><span class="pill-dot"></span>Policy Signal</button>
  <button class="signal-filter-pill fpill-geopolitical" data-signal="geopolitical" onclick="toggleSignalFilter('geopolitical', this)"><span class="pill-dot"></span>Geopolitical</button>
  <button class="signal-filter-pill fpill-viral" data-signal="viral" onclick="toggleSignalFilter('viral', this)"><span class="pill-dot"></span>Viral Potential</button>
  <button class="signal-filter-pill fpill-trend" data-signal="trend" onclick="toggleSignalFilter('trend', this)"><span class="pill-dot"></span>Industry Shift</button>
  <button class="clear-signals" id="clearSignals" onclick="clearSignalFilters()">✕ Clear</button>
</div>

<div class="stats-bar">
  <div class="stat">
    <div class="stat-value" id="totalCount">20</div>
    <div class="stat-label">Articles</div>
  </div>
  <div class="stat-divider"></div>
  <div class="stat">
    <div class="stat-value" style="color:var(--bloomberg)" id="bloombergCount">10</div>
    <div class="stat-label">Bloomberg</div>
  </div>
  <div class="stat-divider"></div>
  <div class="stat">
    <div class="stat-value" style="color:var(--reuters)" id="reutersCount">10</div>
    <div class="stat-label">Reuters</div>
  </div>
  <div class="stat-divider"></div>
  <div class="stat">
    <div class="stat-value" style="color:var(--accent)" id="visibleCount">20</div>
    <div class="stat-label">Visible</div>
  </div>
</div>

<main>
  <!-- Split view -->
  <div class="feed-grid" id="splitView">
    <div class="feed-col" id="bloombergCol">
      <div class="col-header bloomberg">
        <span class="source-name bloomberg">Bloomberg Technology</span>
        <span class="col-count" id="bCount">10 articles</span>
      </div>

let currentFilter = 'all';
let currentSearch = '';
let activeSignals = new Set();

function renderSignalPills(signals) {
  if (!signals || !signals.length) return '';
  return `<div class="signal-pills">${signals.map(s => `
    <span class="signal-pill pill-${s.theme}">
      <span class="pill-dot"></span>${s.label}
    </span>`).join('')}</div>`;
}

function renderArticle(item, index, source) {
  const id = `why-${source}-${index}`;
  const signalThemes = (item.signals || []).map(s => s.theme).join(',');
  return `
    <div class="article" data-source="${source}" data-title="${item.title.toLowerCase()}" data-tag="${item.tag.toLowerCase()}" data-signals="${signalThemes}">
      <div class="article-meta">
        <span class="article-num">${String(index+1).padStart(2,'0')}</span>
        <span class="article-tag">${item.tag}</span>
        <span class="article-date">${item.date}</span>
      </div>
      <div class="article-title">${item.title}</div>
      ${renderSignalPills(item.signals)}
      <div class="article-desc">${item.desc}</div>
      <div class="article-footer">
        <div class="why-badge" onclick="toggleWhy('${id}')">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
          Why top 10?
        </div>
        <a class="read-link" href="${item.url}" target="_blank">Read →</a>
      </div>
      <div class="why-panel" id="${id}">${item.why}</div>
    </div>
  `;
}

function toggleSignalFilter(theme, btn) {
  if (activeSignals.has(theme)) {
    activeSignals.delete(theme);
    btn.classList.remove('active');
  } else {
    activeSignals.add(theme);
    btn.classList.add('active');
  }
  const clearBtn = document.getElementById('clearSignals');
  clearBtn.classList.toggle('visible', activeSignals.size > 0);
  filterArticles();
}

function clearSignalFilters() {
  activeSignals.clear();
  document.querySelectorAll('.signal-filter-pill').forEach(b => b.classList.remove('active'));
  document.getElementById('clearSignals').classList.remove('visible');
  filterArticles();
}

function toggleWhy(id) {
  const el = document.getElementById(id);
  el.classList.toggle('open');
}

function renderAll() {
  document.getElementById('bloombergFeed').innerHTML = BLOOMBERG.map((a,i) => renderArticle(a,i,'bloomberg')).join('');
  document.getElementById('reutersFeed').innerHTML = REUTERS.map((a,i) => renderArticle(a,i,'reuters')).join('');
  updateCounts();
}

function setFilter(source, btn) {
  currentFilter = source;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');

  const splitView = document.getElementById('splitView');
  const combinedView = document.getElementById('combinedView');

  if (source === 'all') {
    splitView.style.display = 'grid';
    combinedView.style.display = 'none';
    document.getElementById('bloombergCol').style.display = '';
    document.getElementById('reutersCol').style.display = '';
  } else if (source === 'bloomberg') {
    splitView.style.display = 'grid';
    combinedView.style.display = 'none';
    document.getElementById('bloombergCol').style.display = '';
    document.getElementById('reutersCol').style.display = 'none';
  } else if (source === 'reuters') {
    splitView.style.display = 'grid';
    combinedView.style.display = 'none';
    document.getElementById('bloombergCol').style.display = 'none';
    document.getElementById('reutersCol').style.display = '';
  }

  filterArticles();
}

function filterArticles() {
  currentSearch = document.getElementById('search').value.toLowerCase();
  const allArticles = document.querySelectorAll('.article');
  let visible = 0;

  allArticles.forEach(a => {
    const matchSearch = !currentSearch ||
      a.dataset.title.includes(currentSearch) ||
      a.dataset.tag.includes(currentSearch);

    const articleSignals = a.dataset.signals ? a.dataset.signals.split(',') : [];
    const matchSignal = activeSignals.size === 0 ||
      [...activeSignals].some(s => articleSignals.includes(s));

    const show = matchSearch && matchSignal;
    a.style.display = show ? '' : 'none';
    if (show) visible++;
  });

  document.getElementById('visibleCount').textContent = visible;
}

function updateCounts() {
  document.getElementById('totalCount').textContent = BLOOMBERG.length + REUTERS.length;
  document.getElementById('bloombergCount').textContent = BLOOMBERG.length;
  document.getElementById('reutersCount').textContent = REUTERS.length;
  document.getElementById('visibleCount').textContent = BLOOMBERG.length + REUTERS.length;
  document.getElementById('bCount').textContent = BLOOMBERG.length + ' articles';
  document.getElementById('rCount').textContent = REUTERS.length + ' articles';
}

function refresh() {
  const btn = document.getElementById('refreshBtn');
  btn.classList.add('spinning');
  btn.innerHTML = `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:inline;vertical-align:middle;margin-right:5px"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>Refreshing...`;

  setTimeout(() => {
    btn.classList.remove('spinning');
    btn.innerHTML = `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:inline;vertical-align:middle;margin-right:5px"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>Refresh`;
    document.getElementById('lastUpdate').textContent = 'Updated just now';
    renderAll();
  }, 1200);
}

function copyFeed(source) {
  const urls = {
    bloomberg: 'https://feeds.bloomberg.com/technology/news.rss',
    reuters: 'https://news.google.com/rss/search?q=site%3Areuters.com&hl=en-US&gl=US&ceid=US%3Aen'
  };
  navigator.clipboard.writeText(urls[source]).then(() => {
    alert('Feed URL copied to clipboard!');
  });
}

// Init
renderAll();

// Update timestamp every minute
setInterval(() => {
  const mins = Math.floor((Date.now() - window._loadTime) / 60000);
  if (mins > 0) {
    document.getElementById('lastUpdate').textContent = `Updated ${mins}m ago`;
  }
}, 60000);
window._loadTime = Date.now();
